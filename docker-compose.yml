name: autocontrolqr_runnable_v4
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autocontrolqr
      POSTGRES_USER: autocontrolqr
      POSTGRES_PASSWORD: autocontrolqr_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocontrolqr -d autocontrolqr"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - autocontrolqr

  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=autocontrolqr;Username=autocontrolqr;Password=autocontrolqr_dev;Timeout=5;Command Timeout=15
      Jwt__Key: dev-only-change-this-key-autocontrolqr-2026-very-long
      PublicWebBaseUrl: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:10
    ports:
      - "8080:8080"
    networks:
      - autocontrolqr

  web:
    build: ./frontend
    depends_on:
      - api
    restart: on-failure:10
    ports:
      - "3000:80"
    networks:
      - autocontrolqr

volumes:
  pgdata:

networks:
  autocontrolqr:
    driver: bridge
