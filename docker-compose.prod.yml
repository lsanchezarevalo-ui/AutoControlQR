services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autocontrolqr
      POSTGRES_USER: autocontrolqr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocontrolqr -d autocontrolqr"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - internal

  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=autocontrolqr;Username=autocontrolqr;Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=15
      Jwt__Key: ${JWT_KEY}
      PublicWebBaseUrl: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  web:
    build: ./frontend
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  pgdata:
    external: true
    name: autocontrolqr_prod_pgdata
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
