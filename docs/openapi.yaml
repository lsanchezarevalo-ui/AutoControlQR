openapi: 3.0.0
info:
  title: AutoControl QR API
  version: "0.1.0"
paths:
  /api/readings:
    post:
      summary: Create a reading (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleId:
                  type: string
                odometerKm:
                  type: integer
                name:
                  type: string
                note:
                  type: string
      responses:
        '201':
          description: Created
        '400':
          description: Validation error
